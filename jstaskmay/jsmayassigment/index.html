 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #333;
      padding: 10px;
      color: white;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    .section {
      display: none;
      padding: 20px;
    }
    .active {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a onclick="show('home')">Home</a>
      <a onclick="show('about')">About</a>
      <a onclick="show('contact')">Contact</a>
    </nav>
  </header>

  <div id="home" class="section active">
    <h2>Welcome to Home Page</h2>
    <p>Yeh Home page ka content hai.</p>
  </div>

  <div id="about" class="section">
    <h2>About Us</h2>
    <p>Yeh About page ka content hai.</p>
  </div>

  <div id="contact" class="section">
    <h2>Contact Us</h2>
    <p>Yeh Contact page ka content hai.</p>
  </div>

  <script>
    function show(id) {
      // Sab sections ko hide karo
      let sections = document.querySelectorAll('.section');
      sections.forEach(section => section.classList.remove('active'));

      // Jo section chahiye usay show karo
      document.getElementById(id).classList.add('active');
    }
  </script>

</body>
</html>
